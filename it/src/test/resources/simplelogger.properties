# The suite's own failures have to be findable in the output.
#
# testcontainers, docker-java and Jetty (WireMock's server) together log around forty
# INFO lines per run — image pulls, layer counts, container ids, servlet contexts — which
# is exactly the noise that makes a real assertion failure hard to spot in CI. WARN keeps
# anything that indicates a problem and drops the narration.
org.slf4j.simpleLogger.defaultLogLevel=warn

# Kept at INFO: this is the one line worth having when a run is slow or a pull stalls, and
# it names the image tag actually used — the detail that matters if the container ever
# disagrees with the one docker-compose runs.
org.slf4j.simpleLogger.log.tc.localstack/localstack=info
